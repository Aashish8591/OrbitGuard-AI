
spring.application.name=orbitguard-server

# =====================================================
# SERVER CONFIGURATION
# =====================================================

# Render provides PORT at runtime.
# Locally, the application defaults to port 8080.
server.port=${PORT:8080}


# =====================================================
# MONGODB CONFIGURATION
# =====================================================

# Supply the MongoDB Atlas connection URI through
# the MONGODB_URI environment variable.
spring.data.mongodb.uri=${MONGODB_URI}


# =====================================================
# JWT CONFIGURATION
# =====================================================

# Supply a valid Base64-encoded JWT signing secret
# through the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET}

# Token expiration: 24 hours (milliseconds).
jwt.expiration=86400000


# =====================================================
# AI CONFIGURATION
# =====================================================

# Supply the Gemini API key through the environment.
gemini.api.key=${GEMINI_API_KEY}


# =====================================================
# CORS CONFIGURATION
# =====================================================

# Local development default.
# Override this in Render with your deployed frontend URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =====================================================
# LOGGING CONFIGURATION
# =====================================================

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO


# =====================================================
# JACKSON CONFIGURATION
# =====================================================

spring.jackson.serialization.indent-output=true


# =====================================================
# DEVTOOLS CONFIGURATION
# =====================================================

# Disable development-only restart and LiveReload in production.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
