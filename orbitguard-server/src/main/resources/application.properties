spring.application.name=orbitguard-server

# =====================================================
# SERVER CONFIGURATION
# =====================================================

server.port=8080


# =====================================================
# MONGODB CONFIGURATION
# =====================================================
#
# The actual MongoDB URI is provided through the
# MONGODB_URI environment variable.
#
# Do NOT place database credentials directly here.
#

spring.data.mongodb.uri=${MONGODB_URI}


# =====================================================
# JWT CONFIGURATION
# =====================================================
#
# JWT secret is provided through an environment variable.
# JWT expiration: 24 hours
#

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# =====================================================
# AI CONFIGURATION
# =====================================================
#
# AI provider credentials are provided through
# environment variables.
#
# Never hardcode the API key in source code.
#

gemini.api.key=${GEMINI_API_KEY}


# =====================================================
# LOGGING CONFIGURATION
# =====================================================

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO


# =====================================================
# JACKSON CONFIGURATION
# =====================================================

spring.jackson.serialization.indent-output=true


# =====================================================
# DEVTOOLS CONFIGURATION
# =====================================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true